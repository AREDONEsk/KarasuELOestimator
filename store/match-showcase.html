<!doctype html>
<!-- Third Chrome Web Store graphic (1280x800): the in-match team cards, with demo players.
     Render: node store/render-cards.js && node store/render.js -->
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body { color: #e7e7ea; font-family: "Segoe UI", Inter, system-ui, sans-serif; padding: 0 72px; display: flex; flex-direction: column; justify-content: center;
    background: radial-gradient(55% 70% at 0% 0%, rgba(248,113,113,.12), transparent 60%),
                radial-gradient(55% 70% at 100% 0%, rgba(74,222,128,.14), transparent 60%), #0d0f13; }
  .tag { font-size: 14px; letter-spacing: .16em; font-weight: 800; color: #4ade80; }
  h1 { margin-top: 12px; font-size: 44px; line-height: 1.12; font-weight: 800; letter-spacing: -.015em; }
  .shot { margin-top: 36px; border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .shot img { display: block; width: 1136px; }
  ul { list-style: none; padding: 0; margin-top: 36px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  li { padding-left: 16px; border-left: 3px solid var(--c); }
  li b { display: block; font-size: 18px; color: #f4f4f5; }
  li span { display: block; margin-top: 3px; font-size: 15px; color: #8a8b96; line-height: 1.4; }
</style></head>
<body>
  <div class="tag">ON THE MATCH PAGE</div>
  <h1>See both teams' win chance and your Elo at stake.</h1>
  <div class="shot"><img src="match-cards.png" alt=""></div>
  <ul>
    <li style="--c:#4ade80"><b>Win chance</b><span>For both teams, from their average Elo and level.</span></li>
    <li style="--c:#f87171"><b>If you win, if you lose</b><span>Across your usual HLTV range, with a dot at your average and 🔥 for flame games.</span></li>
    <li style="--c:#a855f7"><b>Where you'd land</b><span>Your Elo and level after the match.</span></li>
  </ul>
</body></html>
