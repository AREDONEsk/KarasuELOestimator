<!doctype html>
<!-- A bare stand-in match page with demo players, so content.js can draw its real team cards for the store image.
     Used by store/render-cards.js. Names and Elo values are made up. -->
<html><head><meta charset="utf-8">
<style> body { margin: 0; padding: 20px; background: #0d0f13; width: 1100px; } .hide { display: none; } </style></head>
<body>
  <div class="match-room__panel-context">Live</div>
  <section class="match-overview">
    <article class="match-overview__team">
      <header class="match-overview__heading"><h2>Nightjar's Team</h2></header>
      <ul class="match-overview__roster">
        <li><span class="match-overview__identity">Nightjar</span> <span>1,742 Elo</span></li>
        <li><span class="match-overview__identity">DemoPlayer</span> <span>1,646 Elo</span></li>
        <li><span class="match-overview__identity">Sample_42</span> <span>1,580 Elo</span></li>
        <li><span class="match-overview__identity">PixelFox</span> <span>1,511 Elo</span></li>
        <li><span class="match-overview__identity">TestPilot</span> <span>1,466 Elo</span></li>
      </ul>
    </article>
    <article class="match-overview__team">
      <header class="match-overview__heading"><h2>Kestrel's Team</h2></header>
      <ul class="match-overview__roster">
        <li><span class="match-overview__identity">Kestrel</span> <span>1,912 Elo</span></li>
        <li><span class="match-overview__identity">Placeholder</span> <span>1,801 Elo</span></li>
        <li><span class="match-overview__identity">NoName</span> <span>1,690 Elo</span></li>
        <li><span class="match-overview__identity">Example7</span> <span>1,625 Elo</span></li>
        <li><span class="match-overview__identity">Mockup</span> <span>1,572 Elo</span></li>
      </ul>
    </article>
  </section>
</body></html>
